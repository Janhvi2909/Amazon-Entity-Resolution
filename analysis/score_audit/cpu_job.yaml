apiVersion: batch/v1
kind: Job
metadata:
  name: ber-codex-audit
  namespace: amlc-ber-jy
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      nodeSelector: {kubernetes.io/hostname: nst-n7}
      restartPolicy: Never
      containers:
      - name: audit
        image: python:3.12-slim
        command: [bash, -c]
        args:
        - |
          set -euo pipefail
          mkdir -p /data/ber/codex_audit
          apt-get update -qq && apt-get install -y -qq libgomp1
          pip install --quiet --cache-dir=/data/wheels polars==1.41.2 numpy==2.4.6 lightgbm==4.7.0
          export PYTHONPATH=/data/ber/code_0927203238/src POLARS_MAX_THREADS=12 OPENBLAS_NUM_THREADS=1
          python -u /data/ber/stack_refine_audit.py --run /work/full/runs/NORM-v3t__BLK-v4b@20__FEAT-v4__MATCH-v5 --prep /work/full/prep/NORM-v3t --feat /work/full/feat/NORM-v3t__BLK-v4b@20__FEAT-v4 --ce-root /data/ber/final_ce --out /data/ber/codex_audit --threads 16 --test 2>&1 | tee /data/ber/codex_audit/run.log
        resources:
          requests: {cpu: '12', memory: 16Gi}
          limits: {cpu: '18', memory: 40Gi}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: work, mountPath: /work, readOnly: true}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: amlc-data}
      - name: work
        hostPath: {path: /var/lib/amlc-ber/work, type: Directory}
